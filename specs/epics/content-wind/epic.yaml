# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (CW → CW-1, CW-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: content-wind
  key: CW
spec:
  title: "Vercel's Content Wind template on Cloudflare Workers and D1"
  summary: "Content Wind — a personal website written in Markdown, built with Nuxt Content, Tailwind CSS and Iconify — run on Cloudflare Workers + Static Assets through Nitro's cloudflare_module preset, every page prerendered and Nuxt Content's queries on a Cloudflare D1 database Terraform provisions per environment; and become an Orun baseline that takes a new site from nothing to live on stage and prod in one landing."
  state: started
  milestones:
    - name: "CW0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [CW-1]
    - name: "CW1 — Content Wind on Workers and D1"
      exitCriteria:
        - "apps/web is Content Wind at f0e56c9 (its app, content and look unchanged), built by Nitro's cloudflare_module preset into one Worker with every page prerendered as static assets"
        - "Nuxt Content's database is the D1 binding DB, created and filled by Nuxt Content on the first query; the D1 root provisions stage and prod"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green"
        - "`wrangler dev` serves the pages and their payloads, and Nuxt Content's query route answers from an empty local D1 Nuxt Content filled"
      tasks: [CW-2]
    - name: "CW2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new site from nothing to live on stage and prod in one landing, then record it"
        - "a site built from it carries the site only, renamed throughout to its own name, repository, Worker and database"
        - "Baseline CI is green: contract tests, the wiring path, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [CW-3]
