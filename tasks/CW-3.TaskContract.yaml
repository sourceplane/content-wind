apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: CW-3
  title: "content-wind becomes an Orun baseline"
spec:
  goal: blueprint.yaml and repo-blueprint.yaml take a new Content Wind site from nothing to live on stage and prod in one landing, held by Baseline CI
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
    - ai/context
    - docs/phases
    - hooks
    - testing
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - specs/epics/content-wind
    - README.md
  doneWhen:
    - every Baseline CI tier is green
    - a site placed from it carries the site only, branded
  gates: []
